name: Coordinate Cross-Repo Release

# Orchestrates releases across the post-consolidation ILN package set:
#   • ILN-Smart-Contract          — Soroban contracts (sibling repo)
#   • Invoice-Liquidity-Network   — monorepo: @iln/sdk, @iln/sdk-next,
#                                   cli, indexer, notifications, oracle-service
#   • ILN-Frontend                — Next.js dApp (sibling repo)
#
# Stale personal-fork owners and npm-based install steps were removed (#934).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0 or v1.2.0-canary.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (skip actual tagging)'
        required: false
        type: boolean
        default: false
      discord_webhook:
        description: 'Discord webhook URL for notification (leave empty to skip)'
        required: false
        type: string

# Least-privilege: tag sibling repos (contents) and trigger their workflows (actions).
# Cross-repo tagging requires CROSS_REPO_RELEASE_TOKEN (PAT); GITHUB_TOKEN only
# covers this repository.
permissions:
  contents: write
  actions: write

jobs:
  coordinate-release:
    runs-on: ubuntu-latest
    env:
      # Prefer a PAT that can tag sibling repos; fall back to GITHUB_TOKEN for
      # same-repo operations and dry-run validation.
      GH_TOKEN: ${{ secrets.CROSS_REPO_RELEASE_TOKEN != '' && secrets.CROSS_REPO_RELEASE_TOKEN || github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERSION: ${{ inputs.version }}
      ORG: Invoice-Liquidity-Network
      CONTRACT_REPO: ILN-Smart-Contract
      MAIN_REPO: Invoice-Liquidity-Network
      FRONTEND_REPO: ILN-Frontend
      DEFAULT_BRANCH: dev

    steps:
      - name: Validate version format
        run: |
          # Allow stable (v1.2.0) and pre-release/canary (v1.2.0-canary.1) tags
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ Invalid version format. Use semver with optional pre-release (e.g. v1.2.0 or v1.2.0-canary.1)"
            exit 1
          fi
          echo "✅ Version format valid: ${{ inputs.version }}"

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm with store cache
        if: ${{ inputs.dry_run != true }}
        uses: ./.github/actions/setup-pnpm

      - name: Log release plan
        run: |
          echo "🚀 Release Plan for ${{ inputs.version }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Org:              $ORG"
          echo "Default branch:   $DEFAULT_BRANCH"
          echo "Package set (this monorepo):"
          echo "  • @iln/sdk              (sdk/)"
          echo "  • @iln/sdk-next         (packages/sdk)"
          echo "  • @invoice-liquidity/cli"
          echo "  • iln-indexer / notifications / oracle-service"
          echo ""
          echo "1️⃣  Tag $CONTRACT_REPO with $VERSION"
          echo "2️⃣  Wait for smart contract deployment CI"
          echo "3️⃣  Update contract IDs in sdk/ + packages/sdk"
          echo "4️⃣  Run SDK tests (pnpm)"
          echo "5️⃣  Tag monorepo SDK release as sdk-$VERSION"
          echo "6️⃣  Update SDK version in $FRONTEND_REPO"
          echo "7️⃣  Wait for frontend CI"
          echo "8️⃣  Tag frontend release as frontend-$VERSION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "🔄 DRY RUN MODE: No actual changes will be made"
          fi

      - name: Step 1 - Tag smart contract repo
        run: |
          echo "🏗️  Tagging $ORG/$CONTRACT_REPO with $VERSION..."
          if [[ "$DRY_RUN" != "true" ]]; then
            SHA=$(gh api "repos/$ORG/$CONTRACT_REPO/commits/$DEFAULT_BRANCH" --jq '.sha')
            gh api "repos/$ORG/$CONTRACT_REPO/git/refs" \
              -X POST \
              -f ref="refs/tags/$VERSION" \
              -f sha="$SHA" || \
              echo "⚠️  Tag may already exist or API error occurred"
          else
            echo "🔄 [DRY RUN] Would tag $ORG/$CONTRACT_REPO@$DEFAULT_BRANCH with $VERSION"
          fi

      - name: Step 2 - Wait for smart contract deployment
        run: |
          echo "⏳ Waiting for smart contract CI to complete..."
          if [[ "$DRY_RUN" != "true" ]]; then
            for i in {1..60}; do
              CONCLUSION=$(gh api "repos/$ORG/$CONTRACT_REPO/actions/runs?event=push&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion // empty')

              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ Smart contract CI passed"
                break
              elif [[ "$CONCLUSION" == "failure" ]]; then
                echo "❌ Smart contract CI failed"
                exit 1
              fi

              echo "⏳ Waiting... ($i/60)"
              sleep 10
            done
          else
            echo "🔄 [DRY RUN] Would wait for $ORG/$CONTRACT_REPO CI on $DEFAULT_BRANCH"
          fi

      - name: Step 3 & 4 - Update SDK contract IDs and test
        run: |
          echo "📦 Updating SDK packages with new contract IDs..."
          if [[ "$DRY_RUN" != "true" ]]; then
            CONTRACT_IDS=$(gh api "repos/$ORG/$CONTRACT_REPO/contents/contract-ids.json" \
              --jq '.content | @base64d' 2>/dev/null || echo "{}")
            echo "Contract IDs payload length: ${#CONTRACT_IDS}"
            echo "Apply IDs to sdk/ and packages/sdk sources before publishing."

            echo "🧪 Running SDK tests with pnpm..."
            pnpm --filter @iln/sdk test
            pnpm --filter @iln/sdk-next test || echo "⚠️  @iln/sdk-next tests may have issues"
          else
            echo "🔄 [DRY RUN] Would update contract IDs in sdk/ + packages/sdk"
            echo "🔄 [DRY RUN] Would run: pnpm --filter @iln/sdk test"
            echo "🔄 [DRY RUN] Would run: pnpm --filter @iln/sdk-next test"
          fi

      - name: Step 5 - Tag SDK (monorepo) release
        run: |
          echo "🏷️  Tagging $ORG/$MAIN_REPO with sdk-$VERSION..."
          if [[ "$DRY_RUN" != "true" ]]; then
            SHA=$(gh api "repos/$ORG/$MAIN_REPO/commits/$DEFAULT_BRANCH" --jq '.sha')
            gh api "repos/$ORG/$MAIN_REPO/git/refs" \
              -X POST \
              -f ref="refs/tags/sdk-$VERSION" \
              -f sha="$SHA" || \
              echo "⚠️  SDK tag may already exist"
          else
            echo "🔄 [DRY RUN] Would tag $ORG/$MAIN_REPO@$DEFAULT_BRANCH with sdk-$VERSION"
          fi

      - name: Step 6 - Update frontend SDK version
        run: |
          echo "🎨 Updating frontend with new SDK version..."
          if [[ "$DRY_RUN" != "true" ]]; then
            gh workflow run ci.yml \
              -R "$ORG/$FRONTEND_REPO" \
              -f sdk-version="$VERSION" || \
              echo "⚠️  Frontend workflow trigger may have failed (check workflow inputs)"
          else
            echo "🔄 [DRY RUN] Would trigger $ORG/$FRONTEND_REPO workflow with sdk-version=$VERSION"
          fi

      - name: Step 7 - Wait for frontend CI
        run: |
          echo "⏳ Waiting for frontend CI to complete..."
          if [[ "$DRY_RUN" != "true" ]]; then
            for i in {1..60}; do
              CONCLUSION=$(gh api "repos/$ORG/$FRONTEND_REPO/actions/runs?event=push&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion // empty')

              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ Frontend CI passed"
                break
              elif [[ "$CONCLUSION" == "failure" ]]; then
                echo "❌ Frontend CI failed"
                exit 1
              fi

              echo "⏳ Waiting... ($i/60)"
              sleep 10
            done
          else
            echo "🔄 [DRY RUN] Would wait for $ORG/$FRONTEND_REPO CI"
          fi

      - name: Step 8 - Tag frontend release
        run: |
          echo "🏷️  Tagging $ORG/$FRONTEND_REPO with frontend-$VERSION..."
          if [[ "$DRY_RUN" != "true" ]]; then
            SHA=$(gh api "repos/$ORG/$FRONTEND_REPO/commits/$DEFAULT_BRANCH" --jq '.sha')
            gh api "repos/$ORG/$FRONTEND_REPO/git/refs" \
              -X POST \
              -f ref="refs/tags/frontend-$VERSION" \
              -f sha="$SHA" || \
              echo "⚠️  Frontend tag may already exist"
          else
            echo "🔄 [DRY RUN] Would tag $ORG/$FRONTEND_REPO@$DEFAULT_BRANCH with frontend-$VERSION"
          fi

      - name: Send Discord notification
        if: always()
        run: |
          WEBHOOK="${{ inputs.discord_webhook }}"
          if [[ -z "$WEBHOOK" ]]; then
            echo "⏭️  Discord webhook not provided, skipping notification"
            exit 0
          fi

          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="succeeded"
            COLOR=3066993
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="failed"
            COLOR=15158332
          fi

          DRY_RUN_TEXT=""
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_TEXT=" (DRY RUN)"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$STATUS_EMOJI Release $VERSION$DRY_RUN_TEXT",
              "description": "Cross-repo release coordination $STATUS_TEXT",
              "color": $COLOR,
              "fields": [
                {"name": "Version", "value": "$VERSION", "inline": true},
                {"name": "Status", "value": "$STATUS_TEXT", "inline": true},
                {"name": "Workflow", "value": "[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ],
              "footer": {"text": "ILN Release Coordinator"}
            }]
          }
          EOF
          )

          curl -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Release summary
        run: |
          echo "📋 Release Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version: $VERSION"
          echo "Status: ${{ job.status }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Mode: 🔄 DRY RUN"
          fi
          echo ""
          echo "Released repositories:"
          echo "  • $ORG/$CONTRACT_REPO (tag: $VERSION)"
          echo "  • $ORG/$MAIN_REPO SDK packages @iln/sdk + @iln/sdk-next (tag: sdk-$VERSION)"
          echo "  • $ORG/$FRONTEND_REPO (tag: frontend-$VERSION)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
